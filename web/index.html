<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Abuse (WebGL)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px monospace; }
    #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    #c { width: min(100vw, 160vh); aspect-ratio: 8 / 5; image-rendering: pixelated; cursor: crosshair; }
    #stage { position: relative; }
    #bar { padding: 6px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    select, button { font: inherit; }
    button.on { background: #7a1f1f; color: #fff; }
    [hidden] { display: none !important; }
    body.touch { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    body.touch #help { display: none; }
    body.touch #c { touch-action: none; }
    #touch { display: none; width: 100%; box-sizing: border-box; padding: 10px 16px; gap: 24px; justify-content: space-between; align-items: center; }
    body.touch #touch { display: flex; }
    #touch .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    #touch button {
      min-width: 52px; min-height: 52px; padding: 0 10px; border-radius: 12px;
      border: 1px solid #555; background: #1c1c1c; color: #ddd; font: bold 15px monospace;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #touch button.active { background: #7a1f1f; color: #fff; }
    #stick { position: relative; width: 108px; height: 108px; border-radius: 50%; background: #141414; border: 1px solid #555; touch-action: none; flex: 0 0 auto; }
    #stick .knob {
      position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%; background: #3a3a3a; border: 1px solid #777; pointer-events: none;
    }
    #weapons { display: block; width: min(100vw, 160vh); height: auto; margin: 6px auto 0; image-rendering: pixelated; cursor: pointer; }
    /* Desktop: the full-height game view pushes the control bar off-screen, so
       shrink the stage 20% so buttons and text stay visible below it. */
    @media (hover: hover) {
      #c { width: min(80vw, 128vh); }
      #weapons { width: min(80vw, 128vh); }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage"><canvas id="c"></canvas></div>
    <div id="touch">
      <div id="stick" aria-label="Movement joystick"><div class="knob"></div></div>
      <div class="acts">
        <button data-key="KeyE" aria-label="Use switch">Use</button>
        <button data-act="special" aria-label="Special power">Special</button>
        <button data-act="lights" aria-label="Toggle lights">Lights</button>
      </div>
    </div>
    <canvas id="weapons" width="320" height="32"></canvas>
    <div id="bar">
      <label>Level <select id="level"></select></label>
      <button id="god" type="button">God mode: off</button>
      <button id="coords" type="button">Show coordinates</button>
      <button id="mute" type="button">Mute</button>
      <button id="fullGame" type="button">Demo</button>
      <button id="playLevel" type="button">Level demo</button>
      <button id="pauseDemo" type="button" disabled>Pause demo</button>
      <button id="speed2" type="button" class="on" title="Demo at twice normal speed">x2</button>
      <button id="speed5" type="button" title="Demo at five times normal speed">x5</button>
      <button id="intro" type="button">Show intro</button>
      <!-- The PPO trainer's controls: out of sight for now (the demo is made by tools/search.mjs). Remove "hidden" to bring them back. -->
      <span id="ppoControls" hidden>
        <button id="ppo" type="button">Train PPO</button>
        <button id="pause" type="button" disabled>Pause</button>
        <label>Show the latest attempt every <select id="showEvery">
          <option value="10">10</option><option value="25">25</option><option value="50" selected>50</option>
          <option value="100">100</option><option value="0">never</option>
        </select> updates</label>
        <button id="loadTrain" type="button">Load training file</button>
        <input id="loadTrainFile" type="file" accept=".json,application/json" hidden>
        <button id="forget" type="button">Forget training</button>
        <span id="ppoStatus"></span>
      </span>
      <span id="hud"></span>
    </div>
    <div id="help">arrows/WASD move, Space/Up jump, Down/E use switch, mouse aim, click/F fire, 1-7 or wheel weapons, right mouse special power, L lights, G god mode</div>
  </div>
  <script>
    // Always run the current code. A plain file server (python3 -m http.server)
    // lets the browser keep old copies of the game's script files, and after an
    // update the page then runs a mix of old and new ones: a new button that
    // does nothing, an empty level list. So every script is asked for under an
    // address that is new on each load of the page, by way of an import map.
    // (When a file is added to src/, add it to this list.)
    const FILES = ['assets', 'audio', 'behaviors', 'bot', 'demo', 'entity', 'game', 'level', 'lighting', 'lisp', 'main', 'ppo', 'renderer', 'spec', 'weapons'];
    const stamp = Date.now();
    const imports = {};
    for (const f of FILES) imports[new URL(`./src/${f}.js`, location.href).href] = new URL(`./src/${f}.js?v=${stamp}`, location.href).href;
    const map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({ imports });
    document.currentScript.after(map);
    const main = document.createElement('script');
    main.type = 'module';
    main.src = `./src/main.js?v=${stamp}`;
    map.after(main);
  </script>
</body>
</html>
