<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Abuse (WebGL)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 13px monospace; }
    #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    canvas { width: min(100vw, 160vh); aspect-ratio: 8 / 5; image-rendering: pixelated; cursor: crosshair; }
    #stage { position: relative; }
    #hint { position: absolute; left: 0; right: 0; top: 6%; text-align: center; color: #fff; font: bold min(2.4vw, 3.8vh) monospace; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000; pointer-events: none; }
    #bar { padding: 6px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    select, button { font: inherit; }
    button.on { background: #7a1f1f; color: #fff; }
    body.touch { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    body.touch #help { display: none; }
    body.touch canvas { touch-action: none; }
    #touch { display: none; width: 100%; box-sizing: border-box; padding: 10px 16px; gap: 24px; justify-content: space-between; align-items: center; }
    body.touch #touch { display: flex; }
    #touch .dpad { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(2, 62px); gap: 8px; }
    #touch .dpad .up { grid-area: 1 / 2; }
    #touch .dpad .left { grid-area: 2 / 1; }
    #touch .dpad .down { grid-area: 2 / 2; }
    #touch .dpad .right { grid-area: 2 / 3; }
    #touch .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    #touch button {
      min-width: 62px; min-height: 62px; padding: 0 12px; border-radius: 14px;
      border: 1px solid #555; background: #1c1c1c; color: #ddd; font: bold 18px monospace;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #touch .dpad button { min-width: 0; min-height: 0; width: 100%; height: 100%; padding: 0; }
    #touch button.active { background: #7a1f1f; color: #fff; }
    #weapons { display: flex; gap: 8px; justify-content: center; align-items: center; padding: 4px; flex-wrap: wrap; }
    #weapons .wslot {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 48px; padding: 4px 6px; background: #141414; border: 1px solid #444;
      border-radius: 8px; opacity: 0.35; cursor: pointer;
    }
    #weapons .wslot.owned { opacity: 1; }
    #weapons .wslot.owned:hover { border-color: #888; }
    #weapons .wslot.current { border-color: #d33; background: #2a1414; }
    #weapons .wslot img { width: 34px; height: 34px; image-rendering: pixelated; }
    #weapons .wslot .ammo { font: bold 11px monospace; color: #ddd; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage"><canvas id="c"></canvas><div id="hint"></div></div>
    <div id="touch">
      <div class="dpad">
        <button class="up" data-key="ArrowUp" aria-label="Up / jump">▲</button>
        <button class="left" data-key="ArrowLeft" aria-label="Left">◀</button>
        <button class="down" data-key="ArrowDown" aria-label="Down">▼</button>
        <button class="right" data-key="ArrowRight" aria-label="Right">▶</button>
      </div>
      <div class="acts">
        <button data-key="KeyE" aria-label="Use switch">Use</button>
        <button data-act="special" aria-label="Special power">Special</button>
        <button data-act="lights" aria-label="Toggle lights">Lights</button>
      </div>
    </div>
    <div id="weapons"></div>
    <div id="bar">
      <label>Level <select id="level"></select></label>
      <button id="god" type="button">God mode: off</button>
      <span id="hud"></span>
    </div>
    <div id="help">arrows/WASD move, Space/Up jump, Down/E use switch, mouse aim, click/F fire, 1-7 or wheel weapons, right mouse special power, L lights, G god mode</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
